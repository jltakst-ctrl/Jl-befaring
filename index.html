<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JL Befaring v0.2</title>
  <style>
    :root{--bg:#050608;--panel:#101318;--panel2:#171b22;--line:#2a303a;--text:#f1f5f9;--muted:#9aa4b2;--accent:#53b5ff;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--chip:#222936;--input:#0b0e13;--shadow:rgba(0,0,0,.45)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:17px}button,input,textarea,select{font:inherit}button{border:0;color:var(--text);background:var(--panel2);border-radius:16px;padding:14px 18px;min-height:50px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}button:active{transform:scale(.99)}.app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:10;background:rgba(5,6,8,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:21px;letter-spacing:.2px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;border-bottom:1px solid var(--line);background:#080a0e}.nav button{white-space:nowrap;background:#10141b;color:#cdd6e1;padding:10px 14px;min-height:44px;border:1px solid var(--line)}.nav button.active{background:#0e2a3d;border-color:#2b8ec8;color:#fff}.page{display:none;padding:16px}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 12px 30px var(--shadow)}.card h2,.card h3{margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:14px;color:var(--muted)}input,textarea,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-height:50px}textarea{min-height:130px;resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--chip);border:1px solid var(--line);padding:13px 15px;border-radius:999px;min-height:48px}.chip.active{background:#0d3a56;border-color:#3eb3ff}.chip.ok{background:#0d2c1b;border-color:#15803d}.chip.warn{background:#332407;border-color:#b7791f}.chip.bad{background:#3a1010;border-color:#dc2626}.biglist{display:grid;gap:10px}.listitem{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 16px;min-height:62px}.listitem .title{font-weight:700}.badge{font-size:13px;padding:6px 9px;border-radius:999px;background:#242b36;color:#cbd5e1}.badge.done{background:#0d2c1b;color:#86efac}.badge.todo{background:#2a2220;color:#fed7aa}.small{color:var(--muted);font-size:14px}.toolbar{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,rgba(5,6,8,.94) 25%);padding:18px 16px calc(12px + env(safe-area-inset-bottom));margin:8px -16px -16px}.primary{background:#075985;border:1px solid #0ea5e9}.danger{background:#3a1010;border:1px solid #7f1d1d}.ghost{background:transparent;border:1px solid var(--line)}.photoBox{border:2px dashed #394150;border-radius:18px;padding:18px;text-align:center;background:#0b0e13;color:#cbd5e1}.hidden{display:none!important}.sectionTitle{margin:18px 0 10px;color:#cbd5e1;font-size:18px;font-weight:800}.pillbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.export{white-space:pre-wrap;background:#080a0e;border:1px solid var(--line);border-radius:18px;padding:14px;min-height:260px;color:#e5e7eb}.muted{color:var(--muted)}.divider{height:1px;background:var(--line);margin:14px 0}.floor{border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:#0d1016}.room{display:flex;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #202630}.room:last-child{border-bottom:0}.roomTag{font-size:12px;border-radius:999px;padding:4px 8px;background:#192231;color:#dbeafe}.quickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.notePreset{background:#151b24;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:54px}.hint{border-left:4px solid var(--accent);padding:10px 12px;background:#071522;border-radius:12px;color:#d8eefc}.back{min-width:54px;padding:12px}.kicker{letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#7dd3fc;font-weight:800;margin-bottom:6px}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">JL Befaring</div><div class="sub">v0.2 prototype · darkmode · IVIT-forarbeid</div></div><button class="ghost" onclick="saveAll()">Lagre</button></header>
  <nav class="nav" id="nav"></nav>

  <main>
    <section id="oppdrag" class="page active"></section>
    <section id="megler" class="page"></section>
    <section id="arealer" class="page"></section>
    <section id="befaring" class="page"></section>
    <section id="punkt" class="page"></section>
    <section id="eksport" class="page"></section>
  </main>
</div>
<script>
const STORAGE='jl_befaring_v02';
const pages=[['oppdrag','Oppdrag'],['megler','Meglerinfo'],['arealer','Arealer/rom'],['befaring','Befaring'],['eksport','Eksport']];
const defaultData={currentPage:'oppdrag',activePoint:null,project:{oppdrag:'22464-11xx',adresse:'Eksempelgata 1',kunde:'',megler:'',byggear:'1969',boligtype:'Enebolig',etasjer:'Kjeller, 1. etasje, loft'},megler:{byggemate:['Taket er tekket med betongtakstein','Yttervegger oppført i bindingsverk','Grunnmur i betong/lettklinker','Saltak med kaldt loft'],byggemateAnnet:'',overflater:['1. etasje: Malte/platerte vegger, laminat/parkett/fliser på gulv','Kjeller: Betong/malte overflater og enkelte innredede rom'],overflaterAnnet:'',oppvarming:['Elektrisk oppvarming','Varmepumpe','Vedovn/ildsted'],oppvarmingAnnet:'',arealKort:'Arealer må kontrolleres mot oppmåling.'},floors:[{name:'Kjeller',area:'',rooms:[{name:'Kjellerstue',type:'BRA-i'},{name:'Bod',type:'BRA-e'}]},{name:'1. etasje',area:'',rooms:[{name:'Stue/kjøkken',type:'BRA-i'},{name:'Bad',type:'BRA-i'}]},{name:'Loft',area:'',rooms:[{name:'Loft',type:'BRA-i'}]}],points:[]};
const groups=[
 {name:'Utvendig + tak',items:['Taktekking','Undertak/takkonstruksjon','Pipe/ildsted utvendig','Takrenner/nedløp/beslag','Veggkonstruksjon/kledning','Vinduer og ytterdører','Balkong/terrasse','Grunnmur/fundamenter','Drenering/fuktsikring','Terrengforhold','Garasje/tilleggsbygg','HMS ute']},
 {name:'Kjeller',items:['Rom under terreng','Etasjeskiller kjeller','Vannledninger','Avløpsrør','Varmtvannsbereder','Ventilasjon kjeller','Elektrisk anlegg observasjoner','Trapp','HMS kjeller']},
 {name:'1. etasje',items:['Overflater 1. etasje','Kjøkken','Bad/våtrom 1','WC','Vinduer innvendig','Etasjeskiller 1. etasje','Trapp 1. etasje','HMS 1. etasje']},
 {name:'2. etasje',items:['Overflater 2. etasje','Bad/våtrom 2','Soverom','Vinduer 2. etasje','Etasjeskiller 2. etasje','HMS 2. etasje']},
 {name:'Loft',items:['Loft/kaldt loft','Ventilering loft','Fukt/lekkasjespor loft','Takkonstruksjon fra loft','Skadedyr/biologi loft']},
 {name:'Andre avvik',items:['Brann/rømningsforhold','Radon/områdeinfo','Ulovligheter/bruksendring','Dokumentasjon/eieropplysninger','Andre forhold']}
];
const schemas={
 'Taktekking':{fields:{'Type taktekking':['Betongtakstein','Teglstein','Stålplater','Asfaltpapp/shingel','Takfolie','Annet'],'Takform':['Saltak','Valmtak','Pulttak','Flatt tak','Mansard','Annet'],'Besiktiget fra':['Taknivå','Stige','Loft/innvendig','Bakkenivå','Drone','Begrenset']},checks:['Taktekkingen er visuelt kontrollert','Alder/opplyst årstall vurdert','Mose/slitasje vurdert','Beslag/gjennomføringer vurdert','Synlige lekkasjespor vurdert der tilgjengelig'],preset:'Taket er tekket med betongtakstein. Taktekking er visuelt kontrollert fra bakkenivå/taknivå der dette var tilgjengelig. Det registreres normal alders- og bruksslitasje. Eventuelle avvik må beskrives særskilt.'},
 'Undertak/takkonstruksjon':{fields:{'Undertak':['Bordtak med papp','Forenklet undertak','Trefiberplater','Diffusjonsåpent undertak','Ukjent/lukket','Annet'],'Konstruksjon':['Sperretak','Takstoler','W-takstoler','Åstak','Ukjent/lukket','Annet'],'Loftstype':['Kaldt loft','Skråhimling/lukket','Knevegger','Ikke tilgjengelig','Annet']},checks:['Tilgjengelighet vurdert','Lufting vurdert','Synlige fuktskjolder vurdert','Konstruksjonen er visuelt kontrollert der tilgjengelig'],preset:'Takkonstruksjonen er kontrollert fra tilgjengelige områder. Konstruksjonen er lukket/begrenset tilgjengelig flere steder, og vurderingen baseres på synlige forhold på befaringsdagen.'},
 'Loft/kaldt loft':{fields:{'Tilkomst':['Luke','Trapp','Gangbart loft','Begrenset tilkomst','Ikke tilgjengelig'],'Ventilering':['Lufting ved gesims','Gavlventiler','Mønelufting','Begrenset/ukjent','Annet']},checks:['Loft kontrollert fra tilgjengelig område','Undertak/gjennomføringer visuelt kontrollert','Fukt-/lekkasjespor vurdert','Ventilering vurdert','Skadedyr/biologi vurdert'],preset:'Loftet er et kaldt loft og er visuelt kontrollert fra tilgjengelig område. Det er ikke foretatt inngrep i konstruksjonen. Synlige forhold, ventilering og eventuelle fuktskjolder/lekkasjespor er vurdert på befaringsdagen.'},
 'Drenering/fuktsikring':{fields:{'Alder':['Byggeår','Ukjent','Delvis fornyet','Opplyst fornyet','Annet'],'Fuktsikring':['Synlig knotteplast','Ikke synlig','Delvis synlig','Ukjent','Annet'],'Terrengfall':['Fall fra bygg','Flatt mot bygg','Fall mot bygg','Varierende','Annet']},checks:['Alder/opplysninger vurdert','Terrengfall vurdert','Synlig fuktsikring vurdert','Sammenheng med rom under terreng vurdert'],preset:'Drenering/fuktsikring er vurdert ut fra synlige forhold, alder og opplysninger fra eier. Drenering ligger i hovedsak skjult under terreng og kan ikke kontrolleres direkte uten terrenginngrep.'},
 'Kjøkken':{fields:{'Kjøkkeninnredning':['Eldre innredning','Nyere innredning','Oppgradert deler','Ukjent alder','Annet'],'Ventilator':['Avtrekk ut','Omluft','Naturlig ventilasjon','Ukjent','Annet']},checks:['Fuktsøk ved utsatte installasjoner','Vannstopper/lekkasjesikring vurdert','Komfyrvakt vurdert','Ventilator vurdert'],preset:'Kjøkkenet har innredning med benkeplate, kum og plass for hvitevarer. Det er gjort fuktsøk rundt utsatte vanninstallasjoner med håndholdt fuktindikator uten unormale utslag på befaringsdagen.'},
 'Bad/våtrom 1':{fields:{'Overflater gulv':['Fliser','Vinylbelegg','Mikrosement','Annet'],'Vegger':['Fliser','Baderomsplater','Malt panel/plater','Annet'],'Sluk':['Plastsluk','Støpejern','Rennesluk','Ukjent','Annet'],'Ventilasjon':['Mekanisk avtrekk','Naturlig ventilasjon','Balansert ventilasjon','Ukjent','Annet']},checks:['Fall/høydeforskjell vurdert','Sluk kontrollert der tilgjengelig','Synlig membran/klemring vurdert der mulig','Ventilasjon vurdert','Hulltaking vurdert iht. forskrift/standard'],preset:'Våtrommet er visuelt kontrollert med hensyn til overflater, sluk, fallforhold og ventilering. Det er foretatt fuktsøk på utsatte overflater med håndholdt fuktindikator der dette var relevant.'},
 'Rom under terreng':{fields:{'Utførelse':['Innredet rom under terreng','Uinnredet kjeller','Utforede vegger','Synlig mur/betong','Annet'],'Fuktindikasjon':['Ingen forhøyede verdier','Forhøyede verdier målt','Synlige fuktsymptomer','Ikke målt','Annet']},checks:['Fuktsøk/fuktmåling vurdert','Synlige saltutslag/fuktskjolder vurdert','Organiske materialer mot terreng vurdert','Sammenheng med drenering vurdert'],preset:'Rom under terreng er vurdert med bakgrunn i synlige forhold og tilgjengelige målinger. Konstruksjoner mot terreng er risikokonstruksjoner, og skjulte forhold kan ikke kontrolleres fullt ut uten destruktive inngrep.'},
 'HMS ute':{fields:{'Tema':['Rekkverk','Trapp','Brann/rømning','Fallfare','El-observasjon','Annet']},checks:['Åpenbare HMS-avvik vurdert','Rekkverk/trapp vurdert der relevant','Forhold som bør nevnes i rapporten notert'],preset:'Åpenbare forhold knyttet til helse, miljø og sikkerhet er vurdert visuelt. Det er kun gjort en enkel vurdering av observerbare forhold.'}
};
function initPoints(){return groups.flatMap(g=>g.items.map(n=>({name:n,group:g.name,status:'Ikke startet',comment:schemas[n]?.preset||'',checks:{},fields:{},photos:0,other:''})))}
let data=load(); if(!data.points.length)data.points=initPoints();
function load(){try{return {...defaultData,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch(e){return structuredClone(defaultData)}}
function saveAll(){localStorage.setItem(STORAGE,JSON.stringify(data));toast('Lagret lokalt')}
function toast(t){document.querySelector('.sub').textContent=t;setTimeout(()=>document.querySelector('.sub').textContent='v0.2 prototype · darkmode · IVIT-forarbeid',1500)}
function nav(){document.getElementById('nav').innerHTML=pages.map(([id,name])=>`<button class="${data.currentPage===id?'active':''}" onclick="show('${id}')">${name}</button>`).join('')}
function show(id){data.currentPage=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));nav();render();window.scrollTo(0,0)}
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){nav();renderOppdrag();renderMegler();renderArealer();renderBefaring();renderPunkt();renderEksport()}
function renderOppdrag(){let p=data.project;document.getElementById('oppdrag').innerHTML=`<div class="card"><div class="kicker">Start</div><h2>Oppdrag</h2><div class="grid">${field('Oppdragsnummer','oppdrag',p.oppdrag)}${field('Adresse','adresse',p.adresse)}${field('Kunde','kunde',p.kunde)}${field('Megler','megler',p.megler)}${field('Byggeår','byggear',p.byggear)}${field('Boligtype','boligtype',p.boligtype)}${field('Etasjer','etasjer',p.etasjer)}</div><div class="toolbar"><button class="primary" onclick="show('megler')">Neste: Meglerinfo</button></div></div>`}
function field(label,key,val){return `<div class="field"><label>${label}</label><input value="${h(val)}" oninput="data.project['${key}']=this.value;saveAll()"></div>`}
function optionBlock(title,key,opts){let arr=data.megler[key]||[];return `<div class="field"><label>${title}</label><div class="chips">${opts.map(o=>`<button class="chip ${arr.includes(o)?'active':''}" onclick="toggleMegler('${key}','${h(o)}')">${h(o)}</button>`).join('')}</div><textarea placeholder="Annet / presisering" oninput="data.megler['${key}Annet']=this.value;saveAll()">${h(data.megler[key+'Annet'])}</textarea></div>`}
function toggleMegler(key,o){let a=data.megler[key]||[];data.megler[key]=a.includes(o)?a.filter(x=>x!==o):[...a,o];saveAll();renderMegler()}
function renderMegler(){document.getElementById('megler').innerHTML=`<div class="card"><div class="kicker">Rask info før rapport</div><h2>Meglerinfo</h2><div class="hint">Dette er ment som rask info til megler før rapporten er ferdig.</div>${optionBlock('Byggemåte','byggemate',['Taket er tekket med betongtakstein','Taket er tekket med papp/shingel','Yttervegger i bindingsverk','Yttervegger i mur/betong','Grunnmur i betong/lettklinker','Kaldt loft','Kjeller/underetasje','Garasje/tilleggsbygg'])}${optionBlock('Overflater per etasje','overflater',['1. etasje: Malte/platerte vegger','1. etasje: Parkett/laminat/fliser','Kjeller: Betong/malte overflater','Kjeller: Delvis innredet','Loft: Panel/plater','Våtrom med fliser','Våtrom med belegg/plater'])}${optionBlock('Oppvarmingsmåte','oppvarming',['Elektrisk oppvarming','Varmepumpe','Vedovn/ildsted','Vannbåren varme','Panelovner','Varmekabler','Fellesanlegg','Annet'])}<div class="field"><label>Kort arealnotat</label><textarea oninput="data.megler.arealKort=this.value;saveAll()">${h(data.megler.arealKort)}</textarea></div><div class="toolbar"><button class="ghost" onclick="show('oppdrag')">Tilbake</button><button class="primary" onclick="show('arealer')">Neste: Arealer/rom</button></div></div>`}
function renderArealer(){document.getElementById('arealer').innerHTML=`<div class="card"><div class="kicker">Arealer</div><h2>Arealer og rom</h2><div class="hint">Registrer areal per etasje. Rom merkes som BRA-i, BRA-e eller TBA.</div>${data.floors.map((f,i)=>floorHtml(f,i)).join('')}<div class="row"><button onclick="addFloor()">+ Legg til etasje</button></div><div class="toolbar"><button class="ghost" onclick="show('megler')">Tilbake</button><button class="primary" onclick="show('befaring')">Neste: Befaring</button></div></div>`}
function floorHtml(f,i){return `<div class="floor"><div class="row"><input style="flex:2" value="${h(f.name)}" oninput="data.floors[${i}].name=this.value;saveAll()"><input style="flex:1" placeholder="Areal m²" value="${h(f.area)}" oninput="data.floors[${i}].area=this.value;saveAll()"><button class="danger" onclick="delFloor(${i})">Fjern</button></div><div class="sectionTitle">Rom</div>${f.rooms.map((r,j)=>`<div class="room"><input value="${h(r.name)}" oninput="data.floors[${i}].rooms[${j}].name=this.value;saveAll()"><select onchange="data.floors[${i}].rooms[${j}].type=this.value;saveAll()"><option ${r.type==='BRA-i'?'selected':''}>BRA-i</option><option ${r.type==='BRA-e'?'selected':''}>BRA-e</option><option ${r.type==='TBA'?'selected':''}>TBA</option></select><button class="danger" onclick="delRoom(${i},${j})">−</button></div>`).join('')}<button onclick="addRoom(${i})">+ Rom</button></div>`}
function addFloor(){data.floors.push({name:'Ny etasje',area:'',rooms:[]});saveAll();renderArealer()}function delFloor(i){data.floors.splice(i,1);saveAll();renderArealer()}function addRoom(i){data.floors[i].rooms.push({name:'Nytt rom',type:'BRA-i'});saveAll();renderArealer()}function delRoom(i,j){data.floors[i].rooms.splice(j,1);saveAll();renderArealer()}
function renderBefaring(){document.getElementById('befaring').innerHTML=`<div class="card"><div class="kicker">Følg faktisk befaring</div><h2>Befaringsmodus</h2>${groups.map(g=>`<div class="sectionTitle">${g.name}</div><div class="biglist">${g.items.map(n=>{let p=data.points.find(x=>x.name===n);let cls=p?.status==='Ferdig'?'done':p?.status==='Påbegynt'?'todo':'';return `<div class="listitem" onclick="openPoint('${h(n)}')"><div><div class="title">${h(n)}</div><div class="small">${p?.photos||0} bilder · ${p?.comment?'notat finnes':'ingen kommentar'}</div></div><span class="badge ${cls}">${p?.status||'Ikke startet'}</span></div>`}).join('')}</div>`).join('')}<div class="toolbar"><button class="ghost" onclick="show('arealer')">Tilbake</button><button class="primary" onclick="show('eksport')">Eksport</button></div></div>`}
function openPoint(n){data.activePoint=n;data.currentPage='punkt';show('punkt')}function point(){return data.points.find(p=>p.name===data.activePoint)||data.points[0]}
function renderPunkt(){let p=point(); if(!p){document.getElementById('punkt').innerHTML='';return}let s=schemas[p.name]||{fields:{},checks:['Kontrollert','Avvik vurdert','Bilder/notat lagt inn ved behov'],preset:''};document.getElementById('punkt').innerHTML=`<div class="card"><div class="row"><button class="back" onclick="show('befaring')">←</button><div><div class="kicker">${h(p.group)}</div><h2>${h(p.name)}</h2></div></div><div class="sectionTitle">Status</div><div class="chips"><button class="chip ${p.status==='Ikke startet'?'active':''}" onclick="setPoint('status','Ikke startet')">Ikke startet</button><button class="chip ${p.status==='Påbegynt'?'active':''}" onclick="setPoint('status','Påbegynt')">Påbegynt</button><button class="chip ok ${p.status==='Ferdig'?'active':''}" onclick="setPoint('status','Ferdig')">Ferdig</button><button class="chip warn ${p.status==='Må tilbake'?'active':''}" onclick="setPoint('status','Må tilbake')">Må tilbake</button></div>${Object.keys(s.fields).length?`<div class="sectionTitle">Hurtigvalg</div>${Object.entries(s.fields).map(([k,opts])=>`<div class="field"><label>${h(k)}</label><div class="chips">${opts.map(o=>`<button class="chip ${(p.fields[k]||[]).includes(o)?'active':''}" onclick="togglePointField('${h(k)}','${h(o)}')">${h(o)}</button>`).join('')}</div></div>`).join('')}`:''}<div class="sectionTitle">Forskrift/NS-sjekk</div><div class="quickgrid">${s.checks.map(c=>`<button class="notePreset ${p.checks[c]?'active chip ok':''}" onclick="toggleCheck('${h(c)}')">${p.checks[c]?'✓ ':'☐ '}${h(c)}</button>`).join('')}</div><div class="sectionTitle">Kommentar / diktat</div><textarea oninput="p.comment=this.value;p.status=p.status==='Ikke startet'?'Påbegynt':p.status;saveAll();renderBefaring()">${h(p.comment)}</textarea><div class="field"><label>Annet / spesielle forhold</label><textarea oninput="p.other=this.value;saveAll()">${h(p.other)}</textarea></div><div class="sectionTitle">Bilder</div><div class="photoBox"><p>${p.photos||0} bilder registrert i prototype</p><button onclick="p.photos=(p.photos||0)+1;p.status='Påbegynt';saveAll();renderPunkt()">+ Legg til bilde</button><button class="ghost" onclick="p.photos=Math.max(0,(p.photos||0)-1);saveAll();renderPunkt()">− Fjern ett</button><p class="small">I fungerende app åpner denne kamera/bildevelger.</p></div><div class="toolbar"><button class="ghost" onclick="show('befaring')">Til listen</button><button class="primary" onclick="nextPoint()">Neste punkt</button></div></div>`}
function setPoint(k,v){let p=point();p[k]=v;saveAll();renderPunkt();renderBefaring()}function toggleCheck(c){let p=point();p.checks[c]=!p.checks[c]; if(p.status==='Ikke startet')p.status='Påbegynt';saveAll();renderPunkt()}function togglePointField(k,o){let p=point();let a=p.fields[k]||[];p.fields[k]=a.includes(o)?a.filter(x=>x!==o):[...a,o];if(p.status==='Ikke startet')p.status='Påbegynt';saveAll();renderPunkt()}
function nextPoint(){let idx=data.points.findIndex(p=>p.name===data.activePoint);data.activePoint=data.points[(idx+1)%data.points.length].name;saveAll();renderPunkt();window.scrollTo(0,0)}
function renderEksport(){document.getElementById('eksport').innerHTML=`<div class="card"><div class="kicker">Klipp og lim</div><h2>Eksport</h2><div class="chips"><button class="primary" onclick="makeExport('ivit')">IVIT-kladd</button><button onclick="makeExport('megler')">Meglerinfo</button><button onclick="makeExport('logg')">Befaringslogg</button><button onclick="downloadJson()">Backup JSON</button></div><div class="field"><label>Eksporttekst</label><div id="exportBox" class="export">Trykk på en eksportknapp.</div></div><div class="toolbar"><button class="ghost" onclick="show('befaring')">Tilbake</button></div></div>`}
function makeExport(type){let txt='';if(type==='megler'){txt=`MEGLERINFO – ${data.project.adresse}\n\nArealer:\n${data.floors.map(f=>`- ${f.name}: ${f.area||'[mangler]'} m²`).join('\n')}\n\nByggemåte:\n${[...data.megler.byggemate,data.megler.byggemateAnnet].filter(Boolean).join('\n')}\n\nOverflater per etasje:\n${[...data.megler.overflater,data.megler.overflaterAnnet].filter(Boolean).join('\n')}\n\nOppvarmingsmåte:\n${[...data.megler.oppvarming,data.megler.oppvarmingAnnet].filter(Boolean).join('\n')}\n\nArealnotat:\n${data.megler.arealKort||''}`}
else if(type==='ivit'){txt=`IVIT-KLADD – ${data.project.adresse}\n\nOppdrag: ${data.project.oppdrag}\nByggeår: ${data.project.byggear}\nBoligtype: ${data.project.boligtype}\n\n`+data.points.filter(p=>p.comment||p.other||p.photos||Object.values(p.fields).flat().length).map(p=>`## ${p.name}\nStatus: ${p.status}\nHurtigvalg: ${Object.entries(p.fields).map(([k,v])=>`${k}: ${v.join(', ')}`).join(' | ')}\nSjekket: ${Object.entries(p.checks).filter(([k,v])=>v).map(([k])=>k).join(', ')}\nKommentar:\n${p.comment||''}\n${p.other?`\nAnnet:\n${p.other}`:''}\nBilder: ${p.photos||0}\n`).join('\n---\n')}
else{txt=`BEFARINGSLOGG – ${data.project.adresse}\n\n`+groups.map(g=>`${g.name}\n`+g.items.map(n=>{let p=data.points.find(x=>x.name===n);return `- ${n}: ${p.status}, ${p.photos||0} bilder${p.comment?' – notat':''}`}).join('\n')).join('\n\n')}
document.getElementById('exportBox').textContent=txt}
function downloadJson(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.project.oppdrag||'jl-befaring')+'.json';a.click()}
render();
</script>
</body>
</html>
